<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 84" role="img" aria-label="Ische Ghuree kite logo">
  <!-- diamond kite: four facets -->
  <g stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="32,3 32,30 9,26" fill="#22b8cf"/>
    <polygon points="32,3 32,30 55,26" fill="#f76707"/>
    <polygon points="9,26 32,30 32,54" fill="#37b24d"/>
    <polygon points="55,26 32,30 32,54" fill="#e64980"/>
  </g>
  <!-- kite spine highlight -->
  <line x1="32" y1="3" x2="32" y2="54" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
  <!-- tail -->
  <path d="M32 54 C 30 62, 38 64, 34 70 C 31 74.5, 24 74, 26 80"
        fill="none" stroke="#1d3557" stroke-width="1.8" stroke-linecap="round"/>
  <!-- tail bows -->
  <g stroke="none">
    <path d="M35.2 60.8 l5 -2.6 -0.6 5.4 z" fill="#e64980"/>
    <path d="M35.2 60.8 l-5.2 -2 1.4 5 z" fill="#f76707"/>
    <path d="M33.6 69.4 l5.2 -1.4 -1.6 5 z" fill="#22b8cf"/>
    <path d="M33.6 69.4 l-4.8 -2.6 0.4 5.4 z" fill="#37b24d"/>
    <path d="M26.4 76.6 l5 -2 -1 5.2 z" fill="#fcc419"/>
    <path d="M26.4 76.6 l-5 -1.6 1.6 4.8 z" fill="#e64980"/>
  </g>
</svg>
